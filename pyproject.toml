# params.gamma = 1.1378
# params.tree-method = "hist"
# params.eval-metric = "auc"
# params.seed = 42
# params.nthread = 16


# XGBoost parameters - Small Optimized Mean
params.objective = "binary:logistic"
params.eta = 0.0720
params.max-depth = 11
params.reg-lambda = 17.6
params.colsample-bytree = 0.8386
params.subsample = 0.7728
params.min-child-weight = 6
params.gamma = 0.7622
params.tree-method = "hist"
params.eval-metric = "auc"
params.seed = 42
params.nthread = 16


[tool.flwr.federations]
default = "local-simulation"

[tool.flwr.federations.local-simulation]
options.num-supernodes = 5          # number of banks

